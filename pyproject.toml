[project]
name = "spreadpilot"
version = "0.1.0"
description = "Financial statement spreading and covenant drafting assistant (personal learning project)"
requires-python = ">=3.10"
dependencies = [
    "anthropic>=0.40.0",
    "openpyxl>=3.1.0",
    "pdfplumber>=0.11.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
